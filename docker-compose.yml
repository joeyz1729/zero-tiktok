# yaml 配置
version: "3.7"
services:
  mysqllatest:
    image: "mysql:latest"
    ports:
      - "13306:3306"
    command: "--default-authentication-plugin=mysql_native_password --init-file /repository/application/init.sql"
    environment:
      MYSQL_ROOT_PASSWORD: "root1234"
      MYSQL_PASSWORD: "root1234"
    volumes:
      - ./init.sql:/repository/application/init.sql
  
  redis507:
    image: "redis:5.0.7"
    ports:
      - "16379:6379"