Name: message.tiktok-user
ListenOn: 0.0.0.0:9096
Log:
  ServiceName: message-tiktok-user
  Mode: file
  Path: ./log
Telemetry:
  Name: message-tiktok-user
  Endpoint: http://127.0.0.1:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger
Prometheus:
  Host: 127.0.0.1
  Port: 9086
  Path: /metrics
#Etcd:
#  Hosts:
#  - 127.0.0.1:2379
#  Key: repository.tiktok-user

Mysql:
  DataSource: root:root@(localhost:3306)/tiktok_message?parseTime=true&charset=utf8

CacheRedis:
  - Host: 127.0.0.1:6379

Consul:
  Host: 127.0.0.1:8500
  Key: consul-message.tiktok-user


