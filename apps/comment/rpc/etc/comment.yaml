Name: repository.tiktok-user
ListenOn: 0.0.0.0:9095
Log:
  ServiceName: comment-tiktok-user
#  Mode: file
#  Path: ./log
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: comment.tiktok-user

Mysql:
  DataSource: root:root1234@tcp(localhost:13306)/tiktok_comment?parseTime=true&charset=utf8


CacheRedis:
  Addr: 127.0.0.1:16379

Snowflake:
  StartTime: 2023-08-21
  MachineId: 9095

KafkaMq:
  Name: kq
  Brokers:
    - 127.0.0.1:9092
  Group: tiktok
  Topic: comment
  Offset: first
  Consumer: 1

Telemetry:
  Name: comment-tiktok-user
  Endpoint: http://127.0.0.1:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger


Prometheus:
  Host: 127.0.0.1
  Port: 9085
  Path: /metrics