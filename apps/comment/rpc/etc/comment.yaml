Name: model.rpc
ListenOn: 0.0.0.0:9095
Log:
  ServiceName: comment-rpc
  Mode: file
  Path: ./log
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: comment.rpc

Mysql:
  DataSource: root:root@tcp(localhost:3306)/tiktok_comment?parseTime=true&charset=utf8


CacheRedis:
  Addr: 127.0.0.1:6379

Snowflake:
  StartTime: 2023-08-21
  MachineId: 9095

KafkaMq:
  Name: kq
  Brokers:
    - 127.0.0.1:9092
  Group: tiktok
  Topic: comment
  Offset: first
  Consumer: 1

Telemetry:
  Name: comment-rpc
  Endpoint: http://127.0.0.1:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger


Prometheus:
  Host: 127.0.0.1
  Port: 9085
  Path: /metrics