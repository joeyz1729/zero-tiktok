syntax = "proto3";

package favorite;
option go_package="./model";



service Favorite {
  rpc Action(action_request) returns(action_response);
  rpc GetVideoIds(get_video_ids_request) returns (get_video_ids_response);
}

message action_request {
  int64 user_id = 1;
  int64 video_id = 2;
  int32 action_type = 3;
}

message action_response {
  int32 code = 1;
  string msg = 2;
}


message get_video_ids_request {
  int64 user_id = 1;
}

message get_video_ids_response {
  int64 video_num = 1;
  repeated int64 video_ids = 2;
}
