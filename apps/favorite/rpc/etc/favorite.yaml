Name: rpc.rpc
ListenOn: 0.0.0.0:9094
Log:
  ServiceName: favorite-rpc
  Mode: file
  Path: ./log
Telemetry:
  Name: favorite-rpc
  Endpoint: http://127.0.0.1:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger
Prometheus:
  Host: 127.0.0.1
  Port: 9084
  Path: /metrics
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: favorite.rpc

Mysql:
  DataSource: root:root1234@tcp(localhost:13307)/tiktok_favorite?parseTime=true&charset=utf8

CacheRedis:
  Addr: 127.0.0.1:6379


UserRpc:
  #  Target: consul://127.0.0.1:8500/consul-user.rpc?wait=14s
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
  NonBlock: true

VideoRpc:
  #  Target: consul://127.0.0.1:8500/consul-video.rpc?wait=14s
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: video.rpc
  NonBlock: true


DtmServer: "etcd://localhost:2379/dtmservice"