Name: api-api
Host: 0.0.0.0
Port: 8888
Log:
  ServiceName: bff-api
  Mode: file
  Path: ./log
Telemetry:
  Name: bff-api
  Endpoint: http://127.0.0.1:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger
Prometheus:
  Host: 127.0.0.1
  Port: 9080
  Path: /metrics



UserRpc:
  Target: consul://127.0.0.1:8500/consul-user.rpc?wait=14s

VideoRpc:
  Target: consul://127.0.0.1:8500/consul-video.rpc?wait=14s

FollowRpc:
  Target: consul://127.0.0.1:8500/consul-follow.rpc?wait=14s

FavoriteRpc:
  Target: consul://127.0.0.1:8500/consul-favorite.rpc?wait=14s

CommentRpc:
  Target: consul://127.0.0.1:8500/consul-comment.rpc?wait=14s

MessageRpc:
  Target: consul://127.0.0.1:8500/consul-message.rpc?wait=14s

Auth:
  AccessSecret: "baldur's gate 3"
  AccessExpire: 864000


