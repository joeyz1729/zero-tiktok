syntax = "proto3";

package comment;
option go_package="./pb";

service Comment {
  rpc CommentAction(comment_action_request) returns(comment_action_response);
  rpc GetVideoCommentList(get_video_comment_list_request) returns(get_video_comment_list_response);

  // 添加评论，根据user，video，comment_text
  rpc AddComment(add_comment_request) returns(add_comment_response);
  // 删除评论，根据user，video，comment
  rpc DelComment(del_comment_request) returns(del_comment_response);
  // 查询视频的评论列表
  rpc GetCommentList(get_comment_list_request) returns(get_comment_list_response);
  // 查询单条记录
  rpc GetComment(get_comment_request) returns(get_comment_response);

}
message CommentInfo {
  int64 comment_id = 1;
  int64 user_id = 2;
  int64 video_id = 3;
  string content = 4;
  string create_date = 5;
}

message comment_action_request {
  int64 video_id = 1;
  int64 user_id = 2;
  string comment_text = 3;
}
message comment_action_response {
  CommentInfo comment = 1;
  User author = 2;
}

message add_comment_request {
  int64 video_id = 1;
  int64 user_id = 2;
  string comment_text = 3;
}

message add_comment_response {
  CommentInfo comment = 1;
}

message del_comment_request {
  int64 comment_id = 1;
}
message del_comment_response {
}


message get_comment_request {
  int64 comment_id = 1;
}
message get_comment_response {
  CommentInfo comment = 1;
}

message get_comment_list_request {
  int64 video_id = 1;
  int64 user_id = 2;
}

message get_comment_list_response {
  repeated CommentInfo comment_list = 1;

}

message get_video_comment_list_request {
  int64 video_id = 1;
  int64 user_id = 2;
}
message get_video_comment_list_response {
  repeated CommentInfo comment_list = 1;
}





message User {
  int64 id = 1; // 用户id
  string name = 2; // 用户名称
  int64 follow_count = 3; // 关注总数
  int64 follower_count = 4; // 粉丝总数
  bool is_follow = 5; // true-已关注，false-未关注
  string avatar = 6; //用户头像
  string background_image = 7; //用户个人页顶部大图
  string signature = 8; //个人简介
  int64 total_favorited = 9; //获赞数量
  int64 work_count = 10; //作品数量
  int64 favorite_count = 11;
}


