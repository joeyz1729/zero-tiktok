syntax = "proto3";

package video;
option go_package="./model";

service Video {

//  rpc Feed(feed_request) returns(feed_response);
  rpc PublishAction(publish_action_request) returns(publish_action_response);
  rpc GetListByUserId(get_list_by_user_id_request) returns(get_list_by_user_id_response);
  rpc GetListByAuthorId(get_list_by_author_id_request) returns(get_list_by_author_id_response);

  rpc GetVideoById(get_video_by_id_request) returns(get_video_by_id_response);
  rpc GetVideosByIds(get_videos_by_ids_request) returns(get_videos_by_ids_response);

  rpc Feed(feed_request) returns(feed_response);
  rpc GetWorkCount(get_work_count_request) returns (get_work_count_response);
  rpc UpdateFavoriteCount(update_favorite_count_request) returns(update_favorite_count_response);
}


message feed_request {
  int64 user_id = 1;
  int64 latest_time = 2;
}

message feed_response {
  int64 video_len = 1;
  int64 next_time = 2; // 本次返回的视频中，发布最早的时间，作为下次请求时的latest_time
  repeated VideoInfo video_list = 3; // 视频列表
}


message publish_action_request {
  int64 user_id = 1;
  string title = 2; // 视频标题
  bytes data = 3; // 视频数据
  string type = 4;
}

message publish_action_response {
  int64 video_id = 1;
}


message get_list_by_user_id_request {
  int64 user_id = 1; // 用户id
}

message get_list_by_user_id_response {
  repeated VideoInfo video_list = 1; // 用户发布的视频列表
}

message get_list_by_author_id_request {
  int64 user_id = 1; // 用户id
}

message get_list_by_author_id_response {
  repeated VideoDetail video_list = 1; // 用户发布的视频列表
}

