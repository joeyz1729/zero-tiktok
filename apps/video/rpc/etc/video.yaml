Name: video.tiktok-user
ListenOn: 0.0.0.0:8992
Log:
  ServiceName: video-tiktok-user
#  Mode: file
#  Path: ./log
Telemetry:
  Name: video-tiktok-user
  Endpoint: http://127.0.0.1:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger
Prometheus:
  Host: 127.0.0.1
  Port: 9082
  Path: /metrics
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: video.tiktok-user

Mysql:
  DataSource: root:root1234@tcp(localhost:13306)/tiktok_video?parseTime=true&charset=utf8

CacheRedis:
  - Host: 127.0.0.1:6379

#Consul:
#  Host: 127.0.0.1:8500
#  Key: consul-video.tiktok-user

Salt: video_salt

Snowflake:
  StartTime: 2023-08-24
  MachineId: 9092


RedisDB:
  Host: "127.0.0.1"
  Port: 6379
  Password: ""
  DB: 0
  PoolSize: 100


UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: tiktok-user.tiktok-user
  NonBlock: true


FavorRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: favorite.tiktok-user
  NonBlock: true