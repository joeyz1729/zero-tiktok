syntax = "proto3";

package video;
option go_package="./pb";

service VideoService {
  rpc Feed(feed_request) returns(feed_response);
  rpc PublishAction(publish_action_request) returns(publish_action_response);
  rpc PublishList(publish_list_request) returns(publish_list_response);
  rpc GetVideos(get_videos_request) returns(get_videos_response);

}

message feed_request {
  int64 latest_time = 1;
  int64 user_id = 2;
}
message feed_response {
  repeated Video video_list = 1;
  int64 next_time = 2;
}


message publish_action_request {
  int64 user_id = 1;
  string title = 2; // 视频标题
  string cover_url = 3;
  string play_url = 4;
}
message publish_action_response {
  int64 video_id = 1;
}


message publish_list_request {
  int64 user_id = 1; // 用户id
  int64 author_id = 2;
}
message publish_list_response {
  repeated Video video_list = 1; // 用户发布的视频列表
}


message get_videos_request {
  int64 user_id = 1;
  repeated int64 video_ids = 2;
}
message get_videos_response {
  repeated Video video_list = 1;
}

message User {
  int64 id = 1; // 用户id
  string name = 2; // 用户名称
  int64 follow_count = 3; // 关注总数
  int64 follower_count = 4; // 粉丝总数
  bool is_follow = 5; // true-已关注，false-未关注
  string avatar = 6; //用户头像
  string background_image = 7; //用户个人页顶部大图
  string signature = 8; //个人简介
  int64 total_favorited = 9; //获赞数量
  int64 work_count = 10; //作品数量
  int64 favorite_count = 11; //点赞数量
}

message Video {
  int64 id = 1; // 视频唯一标识
  User author = 2;
  string play_url = 3; // 视频播放地址
  string cover_url = 4; // 视频封面地址
  string title = 5; // 视频标题
  int64 favorite_count = 6; // 视频的点赞总数
  int64 comment_count = 7; // 视频的评论总数
  bool is_favorite = 8; // true-已点赞，false-未点赞
}