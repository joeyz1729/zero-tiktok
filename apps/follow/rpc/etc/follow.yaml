Name: follow.tiktok-user
ListenOn: 0.0.0.0:9093
Log:
  ServiceName: follow-tiktok-user
#  Mode: file
#  Path: ./log
Telemetry:
  Name: follow-tiktok-user
  Endpoint: http://127.0.0.1:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger
Prometheus:
  Host: 127.0.0.1
  Port: 9083
  Path: /metrics

Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: follow.tiktok-user

Mysql:
  DataSource: root:root1234@tcp(localhost:13306)/tiktok_follow?parseTime=true&charset=utf8

RedisDB:
  Host: "127.0.0.1"
  Port: 16379
  Password: ""
  DB: 0
  PoolSize: 100


KafkaMq:
  Name: kq
  Brokers:
    - 127.0.0.1:9092
  Group: tiktok
  Topic: follow-tiktok-user
  Offset: first
  Consumer: 1


UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: tiktok-user.tiktok-user
  NonBlock: true


DtmServer: "etcd://localhost:2379/dtmservice"