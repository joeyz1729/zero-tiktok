syntax = "proto3";

package follow;
option go_package="./model";

message Request {
  string ping = 1;
}

message Response {
  string pong = 1;
}

service Follow {
  rpc Action(action_request) returns(action_response);
  rpc GetFollowIds(get_follow_ids_request) returns(get_follow_ids_response);
  rpc GetFollowerIds(get_follower_ids_request) returns(get_follower_ids_response);
  rpc GetRelation(get_relation_request) returns(get_relation_response);
//  rpc GetRelations(get_relations_request) returns(get_relations_response);
  rpc Add(add_request) returns(add_response);
  rpc Del(del_request) returns(del_response);
  rpc GetFollowCount(get_follow_count_request) returns(get_follow_count_response);
}

message action_request {
  int64 user_id = 1; // 用户鉴权token
  int64 to_user_id = 2; // 对方用户id
  int32 action_type = 3; // 1-关注，2-取消关注
}

message action_response {
  int32 code = 1;
  string msg = 2;
}

message get_follow_ids_request {
  int64 user_id = 1;
  int64 page = 2;
  int64 size = 3;
}

message get_follow_ids_response {
  repeated int64 follow_ids = 1;
}

message get_follower_ids_request {
  int64 user_id = 1;
  uint64 cursor = 2;
  int64 page_size = 3;
}

message get_follower_ids_response {
  repeated int64 follower_ids = 1;
  int64 next_cursor = 2;
}

message get_relation_request {
  int64 user_id = 1;
  int64 to_user_id = 2;
}

message get_relation_response {
  int32 if_following = 1;
  int32 if_follower = 2;
}

message add_request {
  int64 user_id = 1; // 用户鉴权token
  int64 to_user_id = 2; // 对方用户id
}

message add_response {
  int32 code = 1;
  string msg = 2;
}

message del_request {
  int64 user_id = 1; // 用户鉴权token
  int64 to_user_id = 2; // 对方用户id
}

message del_response {
  int32 code = 1;
  string msg = 2;
}

message get_follow_count_request{
  int64 user_id = 1;
  int64 to_user_id = 2;
}

message get_follow_count_response{
  int64 follow_count = 1;
  int64 follower_count = 2;
  bool is_following = 3;
}