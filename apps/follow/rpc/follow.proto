syntax = "proto3";

package follow;
option go_package="./model";

message Request {
  string ping = 1;
}

message Response {
  string pong = 1;
}

service Follow {
  rpc Action(action_request) returns(action_response);
  rpc GetFollowIds(get_follow_ids_request) returns(get_follow_ids_response);
  rpc GetFollowerIds(get_follower_ids_request) returns(get_follower_ids_response);
}

message action_request {
  int64 user_id = 1; // 用户鉴权token
  int64 to_user_id = 2; // 对方用户id
  int32 action_type = 3; // 1-关注，2-取消关注
}

message action_response {
  int32 code = 1;
  string msg = 2;
}

message get_follow_ids_request {
  int64 user_id = 1;
}

message get_follow_ids_response {
  repeated int64 follow_ids = 1;
}

message get_follower_ids_request {
  int64 user_id = 1;
}

message get_follower_ids_response {
  repeated int64 follower_ids = 1;
}